<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Online Shopping</title>

    <style>
        * {t
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
            color: #222;
        }

        /* Header */
        header {
            background: #131921;
            color: white;
            padding: 18px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #ff9900;
        }

        .search-box {
            display: flex;
            flex: 1;
            max-width: 500px;
        }

        .search-box input {
            width: 100%;
            padding: 12px;
            border: none;
            outline: none;
            border-radius: 5px 0 0 5px;
        }

        .search-box button {
            padding: 12px 20px;
            border: none;
            background: #ff9900;
            cursor: pointer;
            border-radius: 0 5px 5px 0;
        }

        .cart-button {
            background: #ff9900;
            color: #111;
            border: none;
            padding: 12px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Navigation */
        nav {
            background: #232f3e;
            padding: 14px 5%;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
            font-size: 15px;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(120deg, #232f3e, #536b85);
            color: white;
            padding: 70px 5%;
            text-align: center;
        }

        .hero h1 {
            font-size: 42px;
            margin-bottom: 15px;
        }

        .hero p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .hero button {
            background: #ff9900;
            padding: 14px 30px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        /* Products */
        .container {
            padding: 40px 5%;
        }

        .section-title {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            padding: 18px;
            text-align: center;
            box-shadow: 0 3px 10px rgba(0,0,0,0.08);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-card h3 {
            font-size: 18px;
            margin-bottom: 10px;
        }

        .price {
            color: #b12704;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .product-card button {
            background: #ff9900;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        .product-card button:hover {
            background: #e68a00;
        }

        /* Cart */
        .cart-section {
            background: white;
            padding: 25px;
            border-radius: 10px;
            margin-top: 40px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #ddd;
            padding: 15px 0;
            gap: 10px;
            flex-wrap: wrap;
        }

        .cart-item button {
            padding: 6px 10px;
            border: none;
            background: #eee;
            cursor: pointer;
            border-radius: 4px;
        }

        .remove-button {
            background: #e53935 !important;
            color: white;
        }

        .cart-total {
            text-align: right;
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }

        .checkout-button {
            background: #28a745;
            color: white;
            border: none;
            padding: 14px 25px;
            margin-top: 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        /* Footer */
        footer {
            background: #131921;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
                align-items: stretch;
            }

            .search-box {
                max-width: 100%;
            }

            nav {
                text-align: center;
            }

            nav a {
                display: inline-block;
                margin: 5px 10px;
            }

            .hero h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">ShopEase</div>

        <div class="search-box">
            <input
                type="text"
                id="searchInput"
                placeholder="Search products..."
                oninput="searchProducts()"
            >
            <button onclick="searchProducts()">Search</button>
        </div>

        <button class="cart-button" onclick="showCart()">
            🛒 Cart (<span id="cartCount">0</span>)
        </button>
    </header>

    <!-- Navigation -->
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#cart">My Cart</a>
        <a href="#footer">Contact</a>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <h1>Welcome to ShopEase</h1>
        <p>Discover amazing products at the best prices!</p>
        <button onclick="scrollToProducts()">Shop Now</button>
    </section>

    <!-- Product Section -->
    <section class="container" id="products">
        <h2 class="section-title">Our Products</h2>

        <div class="products" id="productList"></div>
    </section>

    <!-- Cart Section -->
    <section class="container" id="cart">
        <div class="cart-section">
            <h2 class="section-title">Shopping Cart</h2>

            <div id="cartItems">
                Your cart is empty.
            </div>

            <div class="cart-total">
                Total: ₹<span id="cartTotal">0</span>
            </div>

            <button class="checkout-button" onclick="checkout()">
                Proceed to Checkout
            </button>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer">
        <p>© 2026 ShopEase. All Rights Reserved.</p>
        <p>Contact: support@shopease.com</p>
    </footer>

    <script>
        // Product data
        const products = [
            {
                id: 1,
                name: "Wireless Headphones",
                price: 1499,
                image: "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500"
            },
            {
                id: 2,
                name: "Smart Watch",
                price: 2499,
                image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
            },
            {
                id: 3,
                name: "Running Shoes",
                price: 1999,
                image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"
            },
            {
                id: 4,
                name: "Backpack",
                price: 999,
                image: "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=500"
            },
            {
                id: 5,
                name: "Digital Camera",
                price: 5999,
                image: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=500"
            },
            {
                id: 6,
                name: "Sunglasses",
                price: 799,
                image: "https://images.unsplash.com/photo-1511499767150-a48a237f0083?w=500"
            },
            {
                id: 7,
                name: "Laptop",
                price: 45999,
                image: "https://images.unsplash.com/photo-1496181133206-80ce9b88a853?w=500"
            },
            {
                id: 8,
                name: "Smartphone",
                price: 18999,
                image: "https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=500"
            }
        ];

        // Shopping cart
        let cart = [];

        // Display products
        function displayProducts(productArray) {
            const productList = document.getElementById("productList");

            productList.innerHTML = "";

            if (productArray.length === 0) {
                productList.innerHTML = "<p>No products found.</p>";
                return;
            }

            productArray.forEach(product => {
                productList.innerHTML += `
                    <div class="product-card">
                        <img src="${product.image}"
                             alt="${product.name}"
                             onerror="this.src='https://placehold.co/300x200?text=Product'">

                        <h3>${product.name}</h3>

                        <p class="price">₹${product.price.toLocaleString("en-IN")}</p>

                        <button onclick="addToCart(${product.id})">
                            Add to Cart
                        </button>
                    </div>
                `;
            });
        }

        // Search products
        function searchProducts() {
            const searchValue = document
                .getElementById("searchInput")
                .value.toLowerCase();

            const filteredProducts = products.filter(product =>
                product.name.toLowerCase().includes(searchValue)
            );

            displayProducts(filteredProducts);
        }

        // Add product to cart
        function addToCart(productId) {
            const product = products.find(p => p.id === productId);

            const existingItem = cart.find(item => item.id === productId);

            if (existingItem) {
                existingItem.quantity++;
            } else {
                cart.push({
                    ...product,
                    quantity: 1
                });
            }

            updateCart();

            alert(product.name + " added to cart!");
        }

        // Increase quantity
        function increaseQuantity(productId) {
            const item = cart.find(p => p.id === productId);

            if (item) {
                item.quantity++;
            }

            updateCart();
        }

        // Decrease quantity
        function decreaseQuantity(productId) {
            const item = cart.find(p => p.id === productId);

            if (item) {
                item.quantity--;

                if (item.quantity <= 0) {
                    cart = cart.filter(p => p.id !== productId);
                }
            }

            updateCart();
        }

        // Remove product
        function removeFromCart(productId) {
            cart = cart.filter(item => item.id !== productId);

            updateCart();
        }

        // Update cart
        function updateCart() {
            const cartItems = document.getElementById("cartItems");
            const cartCount = document.getElementById("cartCount");
            const cartTotal = document.getElementById("cartTotal");

            let total = 0;
            let count = 0;

            cartItems.innerHTML = "";

            if (cart.length === 0) {
                cartItems.innerHTML = "Your cart is empty.";
            }

            cart.forEach(item => {
                total += item.price * item.quantity;
                count += item.quantity;

                cartItems.innerHTML += `
                    <div class="cart-item">
                        <div>
                            <strong>${item.name}</strong>
                            <p>₹${item.price.toLocaleString("en-IN")}</p>
                        </div>

                        <div>
                            <button onclick="decreaseQuantity(${item.id})">−</button>

                            <strong>${item.quantity}</strong>

                            <button onclick="increaseQuantity(${item.id})">+</button>
                        </div>

                        <button class="remove-button"
                                onclick="removeFromCart(${item.id})">
                            Remove
                        </button>
                    </div>
                `;
            });

            cartCount.textContent = count;
            cartTotal.textContent = total.toLocaleString("en-IN");
        }

        // Show cart
        function showCart() {
            document.getElementById("cart").scrollIntoView({
                behavior: "smooth"
            });
        }

        // Scroll to products
        function scrollToProducts() {
            document.getElementById("products").scrollIntoView({
                behavior: "smooth"
            });
        }

        // Checkout
        function checkout() {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            alert("Thank you for shopping with ShopEase!");

            cart = [];
            updateCart();
        }

        // Load products when page opens
        displayProducts(products);
    </script>

</body>
</html>
